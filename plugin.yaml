name: whatsapp-tools
version: 0.0.0
description: "WhatsApp tools for coding agents: chats, messages, contacts, history, received files and sends."
manifest_version: 1
requires_hermes: ">=0.22"
provides_tools:
  - whatsapp_account_read
  - whatsapp_chat_archive
  - whatsapp_chat_mute
  - whatsapp_chat_pin
  - whatsapp_chat_read
  - whatsapp_contact_read
  - whatsapp_file_save
  - whatsapp_file_send
  - whatsapp_history_backfill
  - whatsapp_message_delete
  - whatsapp_message_edit
  - whatsapp_message_react
  - whatsapp_message_send
provides_hooks:
  - pre_tool_call
config_schema:
  toolsets:
    description: 'The toolsets that are on: a list of toolset names, or "all". Defaults to the package''s default toolsets.'
  read_only:
    type: bool
    description: Registers no tool that writes. Wins over every other setting.
  tools:
    type: list
    description: Single tools to add by id, whatever their toolset.
  exclude_tools:
    type: list
    description: Single tools to remove by id. Wins over tools and toolsets.
  state_dir:
    description: Where every account's state lives; an absolute path, or one starting with ~. Defaults to $XDG_STATE_HOME/whatsapp-tools, or ~/.local/state/whatsapp-tools.
  download_dir:
    description: Where received files are saved; an absolute path, or one starting with ~. Defaults to ~/Downloads/whatsapp-tools.
  send_dirs:
    type: list
    description: The directories files may be sent from, besides the working directory; absolute paths, or ones starting with ~, without commas. Defaults to none.
  language:
    description: The language of the approval card, such as ja. Defaults to Hermes's display language, else English.
