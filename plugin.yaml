name: whatsapp-tools
version: 0.2.0
description: "WhatsApp tools for coding agents: chats, contacts, history, received files, sends and actions."
manifest_version: 1
requires_hermes: ">=0.22"
provides_tools:
  - whatsapp_account_read
  - whatsapp_chat_archive
  - whatsapp_chat_mark
  - whatsapp_chat_mute
  - whatsapp_chat_pin
  - whatsapp_chat_read
  - whatsapp_contact_read
  - whatsapp_file_save
  - whatsapp_file_send
  - whatsapp_grant_create
  - whatsapp_grant_read
  - whatsapp_grant_revoke
  - whatsapp_history_backfill
  - whatsapp_message_delete
  - whatsapp_message_edit
  - whatsapp_message_react
  - whatsapp_message_send
provides_hooks:
  - pre_tool_call
config_schema:
  toolsets:
    description: 'The toolsets that are on: a list of toolset names, or "all". Defaults to the package''s default toolsets.'
  read_only:
    type: bool
    description: Registers no tool that writes. Wins over every other setting.
  unattended:
    type: bool
    description: "No person can answer: writes run only under a grant that covers them."
  grants_dir:
    type: str
    description: Where grants and their use are kept; default under the user's state directory.
  tools:
    type: list
    description: Single tools to add by id, whatever their toolset.
  exclude_tools:
    type: list
    description: Single tools to remove by id. Wins over tools and toolsets.
  state_dir:
    description: Where every account's state lives; an absolute path, or one starting with ~. Defaults to $XDG_STATE_HOME/whatsapp-tools, or ~/.local/state/whatsapp-tools.
  download_dir:
    description: Where received files are saved; an absolute path, or one starting with ~. Defaults to ~/Downloads/whatsapp-tools.
  send_dirs:
    type: list
    description: The directories files may be sent from, besides the working directory; absolute paths, or ones starting with ~, without commas. Defaults to none.
  exclude_chats:
    type: list
    description: "The chats every tool leaves out: their JIDs as list returns them. List both JIDs of a person who has a phone JID and an …@lid. Defaults to none. Read by tools; the sync service still mirrors them, and no service restart is needed."
  language:
    description: The language of the approval card, such as ja. Defaults to Hermes's display language, else English.
  emoji:
    type: dict
    description: 'The emoji shown beside each toolset, by toolset name; "" shows none. Merged over the package''s emoji.'
